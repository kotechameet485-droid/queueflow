<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="auto">
  <rect width="600" height="240" rx="12" fill="#eff6ff"/>
  
  <!-- Counter Booth -->
  <rect x="40" y="50" width="140" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="55" y="65" width="110" height="30" rx="4" fill="#2563eb"/>
  <text x="110" y="86" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">COUNTER 1</text>
  <circle cx="110" cy="130" r="22" fill="#dbeafe"/>
  <text x="110" y="136" fill="#1e40af" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A102</text>
  <text x="110" y="172" fill="#16a34a" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Serving Now</text>

  <!-- Arrow -->
  <path d="M 200 120 L 240 120 M 230 110 L 240 120 L 230 130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Queue Tokens -->
  <!-- Token 1 -->
  <g transform="translate(260, 65)">
    <rect width="90" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="90" height="24" rx="4" fill="#f1f5f9"/>
    <text x="45" y="16" fill="#475569" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NEXT</text>
    <text x="45" y="62" fill="#2563eb" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">A101</text>
    <text x="45" y="85" fill="#eab308" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wait ~5m</text>
  </g>

  <!-- Token 2 -->
  <g transform="translate(370, 65)">
    <rect width="90" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="90" height="24" rx="4" fill="#f1f5f9"/>
    <text x="45" y="16" fill="#475569" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IN QUEUE</text>
    <text x="45" y="62" fill="#334155" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">A100</text>
    <text x="45" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wait ~15m</text>
  </g>

  <!-- Token 3 -->
  <g transform="translate(480, 65)">
    <rect width="90" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="90" height="24" rx="4" fill="#f1f5f9"/>
    <text x="45" y="16" fill="#475569" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IN QUEUE</text>
    <text x="45" y="62" fill="#334155" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">A099</text>
    <text x="45" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wait ~25m</text>
  </g>
</svg>
