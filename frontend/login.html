<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QueueFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen login-page">

    <nav class="w-full sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm navbar">
        <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between nav-container">
            <a href="index.html" class="flex items-center gap-1.5 text-xl font-bold tracking-tight text-blue-600 no-underline nav-logo">
                <span>Queue</span><span class="text-slate-900">Flow</span>
            </a>
            <ul class="flex items-center gap-4 list-none m-0 p-0 nav-links">
                <li><a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 no-underline">Home</a></li>
                <li><a href="login.html" class="text-sm font-semibold text-blue-600 no-underline px-3 py-1.5 rounded-lg bg-blue-50 active">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="flex items-center justify-center px-4 py-12 login-wrapper">
        <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-8 shadow-sm login-card">
            
            <div class="text-center mb-6 login-header">
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome to QueueFlow</h2>
                <p class="text-sm text-slate-500 mt-1">Login to manage your queue.</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div class="form-group">
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition form-control" 
                        placeholder="Enter your email" 
                        value="student@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
                        <a href="#" onclick="alert('Password reset feature will be available in next release.'); return false;" class="text-xs font-medium text-blue-600 hover:text-blue-800">Forgot?</a>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition form-control" 
                        placeholder="Enter your password" 
                        value="password123"
                        required
                    >
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-sm font-semibold rounded-xl shadow-sm hover:shadow transition-all focus:ring-2 focus:ring-blue-500/20 focus:outline-none btn btn-primary btn-block">
                    Login
                </button>
            </form>

        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
