<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueFlow - Smart Queue Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <nav class="w-full sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm navbar">
        <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between nav-container">
            <a href="index.html" class="flex items-center gap-1.5 text-xl font-bold tracking-tight text-blue-600 no-underline nav-logo">
                <span>Queue</span><span class="text-slate-900">Flow</span>
            </a>
            <ul class="flex items-center gap-4 list-none m-0 p-0 nav-links">
                <li><a href="index.html" class="text-sm font-semibold text-blue-600 no-underline px-3 py-1.5 rounded-lg bg-blue-50 active">Home</a></li>
                <li><a href="login.html" class="btn btn-primary px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm hover:shadow transition-all no-underline">Login</a></li>
            </ul>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto px-4 sm:px-6 py-12 sm:py-16 text-center hero">
        <div class="max-w-3xl mx-auto hero-content">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                Manage Your Queue Smarter
            </h1>
            <p class="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto mb-8">
                QueueFlow helps users book tokens and track their position without waiting in long physical queues. Fast, contactless, and real-time.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3 mb-10 hero-buttons">
                <a href="login.html" class="btn btn-primary px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white text-base font-semibold rounded-xl shadow-sm hover:shadow-md transition-all no-underline">
                    Get Started &rarr;
                </a>
            </div>
            <div class="max-w-lg mx-auto rounded-2xl overflow-hidden shadow-sm border border-slate-200 bg-white p-4 hero-image-box">
                <img src="assets/queue-illustration.svg" alt="QueueFlow Queue Management Illustration" class="w-full h-auto object-contain responsive-img">
            </div>
        </div>
    </header>

    <script src="js/app.js"></script>
</body>
</html>
